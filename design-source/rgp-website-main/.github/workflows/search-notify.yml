# Tell search engines after every production deploy (CORE_CONTRACTS §28 "After every production deploy"; owner decision
# 2026-10-26). Copied into every client repo with the starter; inert in the system repo (GitHub only runs workflows
# from the repository root's .github/).
#
# WHEN: Vercel reports a successful deployment of the Production environment to GitHub (`deployment_status`, sent by
# Vercel's GitHub integration for every git-push deploy, and for a redeploy made through the Vercel API/dashboard of a
# commit that has a GitHub deployment). A Vercel DEPLOY HOOK build reports nothing to GitHub — so the weekly blog
# publisher (publish-scheduled-posts.yml) starts this workflow itself once its posts are live, and anyone can start it
# by hand: Actions → "Tell search engines" → Run workflow (use this after any deploy made outside a git push).
# Preview deploys, failed deploys, and a site whose site.previewMode is true do nothing.
#
# WHAT (scripts/search-notify.mjs): waits until the production domain serves the deployed commit
# ({siteUrl}/search-manifest.json, written by postbuild), then — each step runs even if another fails —
#   a. IndexNow: only the pages whose content changed since the last announced deploy (the manifest stored as the
#      `search-manifest` artifact by the last run whose IndexNow step succeeded). No stored manifest, or it cannot be
#      read → the FULL sitemap list once, and the log says so.
#   b. Bing: resubmits /sitemap.xml every time.   c. Google Search Console: resubmits /sitemap.xml every time.
# The run is red when any step failed; the summary names each failure. Nothing is ever emailed for a run started by
# Vercel (a bot), so the weekly "Search engine watch" in agent-website-builder checks every live site's last deploy was
# announced and opens an issue when it was not.
#
# Keys: organization secrets only — GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_TOKEN_JSON (owner:
# `npm run search:connect`) and BING_WEBMASTER_API_KEY (repository access must be "All repositories"). Never add repo
# copies. The IndexNow key is public (site.indexNow.key). Inputs reach the script as env, never interpolated into shell.
name: Tell search engines
run-name: "Tell search engines: ${{ github.event_name == 'workflow_dispatch' && (inputs.reason || 'manual run') || format('{0} deploy {1}', github.event.deployment.environment, github.event.deployment.sha) }}"

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (shown in the run name), e.g. "deploy made through the Vercel API"'
        type: string
        default: ''
      full:
        description: 'Send EVERY sitemap URL to IndexNow (not only changed pages). Use rarely: engines rate-limit repeats.'
        type: boolean
        default: false
      expect_commit:
        description: 'Optional: wait until production serves this commit SHA before submitting (blank = what is live now)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# One announcing run at a time. Events that announce nothing (Preview / failed deploys) get their own group, so they can
# never replace a waiting Production run. If several Production deploys queue up, GitHub keeps only the newest waiting
# run: it compares with the last announced manifest, so it covers the skipped deploy's changes too.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')) && 'search-notify' || format('search-notify-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  notify:
    # Cheap pre-filter (the script checks again, plus site.previewMode): only a successful Production deploy, or a manual run.
    # GitHub compares these strings case-insensitively.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # deployment_status checks out the deployed commit (GITHUB_SHA); a manual run checks out the branch it was run on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # search-notify.mjs, the IndexNow library and the Bing / Search Console scripts use only Node built-ins: no npm install.
      - name: Tell IndexNow, Bing and Google
        id: notify
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL: ${{ inputs.full }}
          RESULT_DIR: ${{ runner.temp }}/search-manifest
          GH_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node --experimental-strip-types scripts/search-notify.mjs

      # The live manifest becomes "what was last announced" only when IndexNow succeeded, so a failed send is retried next run.
      - name: Keep the announced manifest for the next run
        if: always() && steps.notify.outputs.store_manifest == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: search-manifest
          path: ${{ runner.temp }}/search-manifest/search-manifest.json
          retention-days: 90
          if-no-files-found: error
